[package]
name = "quip-deploy"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Testnet deployment script for quip-arch program"

[[bin]]
name = "deploy"
path = "src/main.rs"

[[bin]]
name = "create-wallet"
path = "src/bin/create_wallet.rs"

[dependencies]
# Arch Network SDK for deployment
arch_sdk = "0.6.2"
arch_program = "0.6.2"

# Serialization
borsh = { version = "1.5.1", features = ["derive"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Hex encoding
hex = "0.4"

# JSON for keypair loading
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# HTTP client for mempool.space API
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

# Bitcoin types for P2TR transaction construction
bitcoin = { version = "=0.32.5", features = ["serde"] }

# Quip-arch library for instruction types and utilities
quip-arch = { path = "..", features = ["no-entrypoint"] }

# WOTS+ post-quantum signatures
hashsigs = { package = "hashsigs-rs", version = "0.0.2" }

# Random number generation for keypair seeds
rand = "0.8"

# Timestamp for keypair files
chrono = "0.4"
