[package]
name = "quip-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "CLI tools for quip-arch deployment and wallet management"

[[bin]]
name = "quip-cli"
path = "src/main.rs"

[dependencies]
# Arch Network SDK
arch_sdk = "0.6.2"
arch_program = "0.6.2"

# Serialization
borsh = { version = "1.5.1", features = ["derive"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Hex encoding
hex = "0.4"

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# HTTP client for mempool.space API
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

# Bitcoin types
bitcoin = { version = "=0.32.5", features = ["serde"] }

# Quip-arch library
quip-arch = { path = "..", features = ["no-entrypoint"] }

# WOTS+ post-quantum signatures
hashsigs = { package = "hashsigs-rs", version = "0.0.2" }

# Random number generation
rand = "0.8"

# Timestamps
chrono = "0.4"
