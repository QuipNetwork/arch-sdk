[workspace]
members = ["cli"]
resolver = "2"

[package]
name = "quip-arch"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Post-quantum secure wallet for ArchVM (Bitcoin)"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Arch Network program framework - updated for testnet compatibility
arch_program = "0.6.2"

# Serialization - version pinned to match arch_program docs
borsh = { version = "1.5.1", features = ["derive"] }

# WOTS+ post-quantum signatures (same as quip-anchor)
hashsigs = { package = "hashsigs-rs", version = "0.0.2" }

# Error handling - compatible with arch_program
thiserror = "1.0"

# Hex encoding for debug output
hex = "0.4"

[features]
no-entrypoint = []
debug = []
test = []

[dev-dependencies]
arch_sdk = "0.6.2"
serial_test = "3.1.1"
tokio = { version = "1", features = ["full"] }
bitcoincore-rpc = "0.19.0"
titan-client = "0.1.50"
apl-token = { version = "0.6.2", features = ["no-entrypoint"] }
apl-associated-token-account = { version = "0.6.2", features = ["no-entrypoint"] }
